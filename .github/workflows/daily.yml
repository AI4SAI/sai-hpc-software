name: Daily multi-software builds
run-name: ${{ inputs.schedule_date && format('SAI daily {0} / {1}', inputs.schedule_date, inputs.mode) || format('SAI {0} / {1}', inputs.mode || 'start', github.run_number) }}

on:
  # The VM's systemd timer dispatches at 03:00 Asia/Shanghai and recovers
  # interrupted observations. GitHub cron is deliberately not a second timer.
  workflow_dispatch:
    inputs:
      mode:
        description: Start a new generation, resume unfinished work, or check runner/SSH
        type: choice
        options: [start, resume, smoke]
        default: start
      software:
        description: Software to build independently
        type: choice
        options: [all, abacus, cp2k, deepmd-kit, lammps, gpumd, qe]
        default: all
      tracks:
        description: Channels; development always builds, unchanged releases skip
        default: development,prerelease,release
      targets:
        description: Native targets — dsprhbm,16v100-avx2,4v100-avx512,8v100v0-avx512
        default: all
      retry_releases:
        description: Explicitly retry the selected release/prerelease versions
        type: boolean
        default: false
      schedule_date:
        description: Local scheduler logical date (YYYY-MM-DD); leave empty for manual builds
        default: ''

permissions:
  contents: read

# Recovery must not replace a queued nightly trigger (GitHub keeps one
# pending run per concurrency group). The relay also locks its persistent state.
concurrency:
  group: sai-daily-${{ inputs.mode == 'resume' && 'recovery' || 'delivery' }}
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, sai-hpc-relay]
    environment: hpc
    timeout-minutes: 1440
    env:
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      GH_TOKEN: ${{ github.token }}
      SOFTWARE: ${{ inputs.software || 'all' }}
      TRACKS: ${{ inputs.tracks || 'development,prerelease,release' }}
      TARGETS: ${{ inputs.targets || 'all' }}
      RETRY_RELEASES: ${{ inputs.retry_releases || false }}
      RELAY_MODE: ${{ inputs.mode || 'start' }}
      SAI_SCHEDULE_DATE: ${{ inputs.schedule_date }}
    steps:
      # This repository is public. Use Git directly to avoid a Node runtime
      # alongside the Listener/Worker; compilation remains in Slurm.
      - name: Check out the frozen controller with Git
        run: |
          git init -q .
          git config core.hooksPath /dev/null
          git config pack.threads 1
          git config pack.windowMemory 4m
          git config core.deltaBaseCacheLimit 4m
          git config gc.auto 0
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin https://github.com/AI4SAI/sai-hpc-software.git
          else
            git remote add origin https://github.com/AI4SAI/sai-hpc-software.git
          fi
          git config --local --unset-all http.https://github.com/.extraheader || :
          git sparse-checkout init --cone
          git sparse-checkout set controller deployment .ci/slurm docs/evidence/sif-lmod-20261024/raw/4V100
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare temporary HPC credentials
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          : "${REMOTE_USER:?Configure REMOTE_USER in the hpc Environment}"
          : "${KEY:?Configure REMOTE_SSH_PRIVATE_KEY in the hpc Environment}"
          mkdir -p -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
      - name: Submit, resume and accept independent Slurm deliveries
        run: |
          args=(--mode "$RELAY_MODE" --software "$SOFTWARE" --tracks "$TRACKS" --targets "$TARGETS")
          if [ "$RETRY_RELEASES" = true ]; then args+=(--retry-releases); fi
          python3 -u controller/daily_relay.py "${args[@]}"
      - name: Report retained relay logs and metadata
        if: always()
        run: |
          printf 'Durable plans, Slurm receipts and full controller logs: %s\n' "$SAI_RELAY_ROOT"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY"; fi
      - name: Remove temporary HPC key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ssh/key"
