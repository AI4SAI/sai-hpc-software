name: Daily multi-software builds

on:
  schedule:
    # 03:00 Asia/Shanghai (UTC+8); GitHub cron uses UTC.
    - cron: '0 19 * * *'
    # Reattach after an interrupted Actions/VPS session; never starts a new build.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Start a new generation, resume unfinished work, or check runner/SSH
        type: choice
        options: [start, resume, smoke]
        default: start
      software:
        description: Software to build independently
        type: choice
        options: [all, abacus, cp2k, deepmd-kit, lammps, gpumd, qe]
        default: all
      tracks:
        description: Channels; development always builds, unchanged releases skip
        default: development,prerelease,release
      targets:
        description: Native targets — dsprhbm,16v100-avx2,4v100-avx512,8v100v0-avx512
        default: all
      retry_releases:
        description: Explicitly retry the selected release/prerelease versions
        type: boolean
        default: false

permissions:
  contents: read

# Hourly recovery must not replace a queued nightly trigger (GitHub keeps one
# pending run per concurrency group). The relay also locks its persistent state.
concurrency:
  group: sai-daily-${{ github.event.schedule == '17 * * * *' && 'recovery' || 'delivery' }}
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, sai-hpc-relay]
    environment: hpc
    timeout-minutes: 1440
    env:
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      GH_TOKEN: ${{ github.token }}
      SOFTWARE: ${{ inputs.software || 'all' }}
      TRACKS: ${{ inputs.tracks || 'development,prerelease,release' }}
      TARGETS: ${{ inputs.targets || 'all' }}
      RETRY_RELEASES: ${{ inputs.retry_releases || false }}
      RELAY_MODE: ${{ github.event.schedule == '17 * * * *' && 'resume' || inputs.mode || 'start' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            controller
            deployment
            .ci/slurm
            docs/evidence/sif-lmod-20261024/raw/4V100
      - name: Prepare temporary HPC credentials
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          : "${REMOTE_USER:?Configure REMOTE_USER in the hpc Environment}"
          : "${KEY:?Configure REMOTE_SSH_PRIVATE_KEY in the hpc Environment}"
          mkdir -p -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
      - name: Submit, resume and accept independent Slurm deliveries
        run: |
          args=(--mode "$RELAY_MODE" --software "$SOFTWARE" --tracks "$TRACKS" --targets "$TARGETS")
          if [ "$RETRY_RELEASES" = true ]; then args+=(--retry-releases); fi
          python3 -u controller/daily_relay.py "${args[@]}"
      - name: Retain relay logs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /home/sai/ci/state/*/plan.json
            /home/sai/ci/state/*/tasks/*/checkpoint.json
            /home/sai/ci/state/*/tasks/*/controller.log
            /home/sai/ci/state/*/tasks/*/results/*.json
            /home/sai/ci/state/*/tasks/*/beta-results/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary HPC key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ssh/key"
