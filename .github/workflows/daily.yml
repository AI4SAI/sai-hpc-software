name: Daily multi-software builds

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      software:
        description: Software to build (all includes the paired MD stack once)
        type: choice
        options: [all, abacus, cp2k, deepmd-kit, lammps, gpumd]
        default: all
      tracks:
        description: Channels; development always builds, unchanged releases skip
        default: development,prerelease,release
      targets:
        description: Native targets — dsprhbm,16v100-avx2,4v100-avx512,8v100v0-avx512
        default: all
      retry_releases:
        description: Explicitly retry the selected release/prerelease versions
        type: boolean
        default: false

permissions:
  contents: read

# Serialise complete scheduled runs without cancelling a running Slurm owner.
concurrency:
  group: sai-daily-delivery
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      abacus: ${{ steps.plan.outputs.abacus }}
      cp2k: ${{ steps.plan.outputs.cp2k }}
      deepmd_kit: ${{ steps.plan.outputs.deepmd_kit }}
      gpumd: ${{ steps.plan.outputs.gpumd }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SOFTWARE: ${{ inputs.software || 'all' }}
          TRACKS: ${{ inputs.tracks || 'development,prerelease,release' }}
          TARGETS: ${{ inputs.targets || 'all' }}
        run: python3 controller/daily_plan.py

  abacus:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.abacus != '' }}
    uses: ./.github/workflows/build.yml
    with:
      targets: ${{ needs.plan.outputs.abacus }}
      tracks: ${{ inputs.tracks || 'development,prerelease,release' }}
      retry_releases: ${{ inputs.retry_releases || false }}
    secrets: inherit

  cp2k:
    needs: [plan, abacus]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.cp2k != '' }}
    uses: ./.github/workflows/cp2k.yml
    with:
      targets: ${{ needs.plan.outputs.cp2k }}
      tracks: ${{ inputs.tracks || 'development,prerelease,release' }}
      retry_releases: ${{ inputs.retry_releases || false }}
    secrets: inherit

  deepmd_kit:
    needs: [plan, cp2k]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.deepmd_kit != '' }}
    uses: ./.github/workflows/deepmd-lammps.yml
    with:
      targets: ${{ needs.plan.outputs.deepmd_kit }}
      tracks: ${{ inputs.tracks || 'development,prerelease,release' }}
      retry_releases: ${{ inputs.retry_releases || false }}
      software: ${{ inputs.software == 'lammps' && 'lammps' || inputs.software == 'deepmd-kit' && 'deepmd-kit' || 'all' }}
      build_candidates: true
    secrets: inherit

  gpumd:
    needs: [plan, deepmd_kit]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.gpumd != '' }}
    uses: ./.github/workflows/gpumd.yml
    with:
      targets: ${{ needs.plan.outputs.gpumd }}
      tracks: ${{ inputs.tracks || 'development,prerelease,release' }}
      retry_releases: ${{ inputs.retry_releases || false }}
    secrets: inherit

  result:
    if: always()
    needs: [plan, abacus, cp2k, deepmd_kit, gpumd]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected deliveries to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Task | Result |\n|---|---|\n')
              for name, job in results.items():
                  out.write(f"| {name} | {job['result']} |\n")
          if results['plan']['result'] != 'success':
              raise SystemExit('Delivery plan failed')
          for name, targets in results['plan']['outputs'].items():
              if targets and results[name]['result'] != 'success':
                  raise SystemExit(f'{name} delivery did not succeed')
          PY
