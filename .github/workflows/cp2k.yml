name: Build CP2K

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: CP2K branch/tag/SHA (master by default)
        required: true
        default: master
      targets:
        description: Native targets (dsprhbm,4v100-avx512,16v100-avx2,8v100v0-avx512)
        required: true
        default: 4v100-avx512
      resume_run:
        description: Optional terminated CP2K run id to repack without recompiling
        required: false
      reference_run:
        description: Verified GPU CP2K benchmark run for CPU-only added-feature references
        required: false
  push:
    paths: ['controller/cp2k_*', 'controller/software_controller.py', 'controller/remote_controller.py', '.github/workflows/cp2k.yml']
  pull_request:
    paths: ['controller/cp2k_*', 'controller/software_controller.py', 'controller/remote_controller.py', '.github/workflows/cp2k.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in controller/*.sh controller/*.sbatch; do
            bash -n "$script"
          done

  resolve-source:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGETS: ${{ inputs.targets }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from resolve_source import resolve
          from remote_controller import TARGETS
          from software_controller import required_acceptance
          requested = list(dict.fromkeys(os.environ['TARGETS'].split(',')))
          if not requested or any(t not in TARGETS for t in requested):
              raise ValueError('invalid target list')
          for target in requested:
              required_acceptance('cp2k', target)
          if os.environ.get('RESUME_RUN') and len(requested) != 1:
              raise ValueError('resume requires exactly one target')
          result = resolve('cp2k/cp2k', os.environ['SOURCE_REF'])
          builds = [dict(result, target=t) for t in requested]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('builds=' + json.dumps(builds) + '\n')
          print(builds)
          PY

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, resolve-source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: hpc
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare repository-secret SSH key
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
      - name: Cache, submit, monitor and verify CP2K SIF
        env:
          SOFTWARE: cp2k
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE_SHA: ${{ matrix.build.sha }}
          SOFTWARE_VERSION: ${{ matrix.build.version }}
          TARGET: ${{ matrix.build.target }}
          RESUME_RUN: ${{ inputs.resume_run }}
          CP2K_REFERENCE_RUN: ${{ inputs.reference_run }}
        run: python3 -u controller/ci.py
      - name: Publish build logs and SAI artifact location
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp2k-results-${{ matrix.build.version }}-${{ matrix.build.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
      - name: Remove temporary SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ssh/key"
