name: Build CP2K

on:
  workflow_call:
    inputs:
      tracks:
        type: string
        required: false
        default: development
      targets:
        type: string
        required: false
        default: 16v100-avx2
      resume_run:
        type: string
        required: false
        default: ''
      reference_run:
        description: Legacy compatibility input; unused by candidate-only CP2K science acceptance
        type: string
        required: false
        default: ''
      retry_releases:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tracks:
        description: Comma-separated release tracks (development,prerelease,release)
        required: true
        default: development
      targets:
        description: Native targets (dsprhbm,4v100-avx512,16v100-avx2,8v100v0-avx512)
        required: true
        default: 16v100-avx2
      resume_run:
        description: Optional terminated CP2K run id to repack without recompiling
        required: false
      reference_run:
        description: Legacy compatibility input; unused by candidate-only CP2K science acceptance
        required: false
      retry_releases:
        description: Explicitly retry selected release/prerelease versions already attempted
        type: boolean
        default: false
  push:
    paths: ['controller/**', 'tests/**', 'profiles/**', 'deployment/**', '.github/workflows/cp2k.yml', '.github/workflows/software-pair.yml']
  pull_request:
    paths: ['controller/**', 'tests/**', 'profiles/**', 'deployment/**', '.github/workflows/cp2k.yml', '.github/workflows/software-pair.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native delivery test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools tcl python3-yaml chrpath
          command -v mksquashfs unsquashfs tclsh
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in controller/*.sh controller/*.sbatch deployment/*/*.sh deployment/*/*.sbatch; do
            bash -n "$script"
          done

  resolve-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
      gpu_builds: ${{ steps.resolve.outputs.gpu_builds }}
      cpu_builds: ${{ steps.resolve.outputs.cpu_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRACKS: ${{ inputs.tracks }}
          TARGETS: ${{ inputs.targets }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from release_contract import SOFTWARE, resolve_tracks
          allowed = SOFTWARE['cp2k']['targets']
          requested = list(dict.fromkeys(t.strip() for t in os.environ['TARGETS'].split(',')))
          requested.sort(key=lambda target: target == 'dsprhbm')
          if not requested or any(t not in allowed for t in requested):
              raise ValueError('invalid target list')
          tracks = [t.strip() for t in os.environ['RELEASE_TRACKS'].split(',')]
          if os.environ.get('RESUME_RUN') and (len(requested) != 1 or len(tracks) != 1):
              raise ValueError('resume requires exactly one target and one track')
          builds = []
          for result in resolve_tracks('cp2k', tracks):
              if result['status'] == 'skipped':
                  print(json.dumps(result))
                  continue
              builds.extend(dict(result, target=t) for t in requested)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('builds=' + json.dumps(builds) + '\n')
              out.write('gpu_builds=' + json.dumps([row for row in builds if row['target'] != 'dsprhbm']) + '\n')
              out.write('cpu_builds=' + json.dumps([row for row in builds if row['target'] == 'dsprhbm']) + '\n')
          print(builds)
          PY

  build:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.resolve-source.outputs.gpu_builds != '[]'
    needs: [validate, resolve-source]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.gpu_builds) }}
    uses: ./.github/workflows/software-pair.yml
    with:
      software: cp2k
      build: ${{ toJSON(matrix.build) }}
      resume_run: ${{ inputs.resume_run }}
      reference_run: ${{ inputs.reference_run }}
      retry_releases: ${{ inputs.retry_releases }}
    secrets: inherit

  build-cpu:
    # CPU and GPU builds and candidate-only science acceptance run independently.
    # Neither target requires an older installation or another target's reference.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.validate.result == 'success' && needs.resolve-source.result == 'success' && needs.resolve-source.outputs.cpu_builds != '[]' }}
    needs: [validate, resolve-source]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.cpu_builds) }}
    uses: ./.github/workflows/software-pair.yml
    with:
      software: cp2k
      build: ${{ toJSON(matrix.build) }}
      resume_run: ${{ inputs.resume_run }}
      reference_run: ${{ inputs.reference_run }}
      retry_releases: ${{ inputs.retry_releases }}
    secrets: inherit

  result:
    if: always()
    needs: [validate, resolve-source, build, build-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected GPU and CPU deliveries completed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Task | Result |\n|---|---|\n')
              for name, job in results.items():
                  out.write(f"| {name} | {job['result']} |\n")
          if results['validate']['result'] != 'success':
              raise SystemExit('Local validation did not succeed')
          if os.environ['GITHUB_EVENT_NAME'] in ('workflow_dispatch', 'schedule'):
              if results['resolve-source']['result'] != 'success':
                  raise SystemExit('Source resolution did not succeed')
              for key, name in (('gpu_builds', 'build'), ('cpu_builds', 'build-cpu')):
                  builds = json.loads(results['resolve-source']['outputs'][key])
                  expected = 'success' if builds else 'skipped'
                  if results[name]['result'] != expected:
                      raise SystemExit(f'{name} deliveries did not complete')
          PY
