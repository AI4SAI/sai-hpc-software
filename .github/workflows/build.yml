name: Build HPC software
on:
  workflow_call:
    inputs:
      tracks:
        type: string
        required: false
        default: development
      targets:
        type: string
        required: false
        default: dsprhbm
      resume_run:
        type: string
        required: false
        default: ''
      retry_releases:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tracks:
        description: Comma-separated release tracks (development,prerelease,release)
        required: true
        default: development
      targets:
        description: Comma-separated accepted targets (dsprhbm,4v100-avx512,16v100-avx2,8v100v0-avx512)
        required: true
        default: dsprhbm
      resume_run:
        description: Optional terminated run id to repack without recompiling (one target only)
        required: false
      retry_releases:
        description: Explicitly retry selected release/prerelease versions already attempted
        type: boolean
        default: false
  push:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native delivery test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools tcl python3-yaml
          command -v mksquashfs unsquashfs tclsh
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in controller/*.sh controller/*.sbatch; do
            bash -n "$script"
          done
  resolve-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRACKS: ${{ inputs.tracks }}
          TARGETS: ${{ inputs.targets }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from release_contract import SOFTWARE, TRACKS, resolve_tracks
          scheduled = os.environ['GITHUB_EVENT_NAME'] == 'schedule'
          allowed = SOFTWARE['abacus']['targets']
          requested = list(dict.fromkeys(t.strip() for t in os.environ['TARGETS'].split(',')))
          if not requested or any(t not in allowed for t in requested):
              raise ValueError('invalid target list')
          tracks = [t.strip() for t in os.environ['RELEASE_TRACKS'].split(',')]
          if os.environ.get('RESUME_RUN') and (len(requested) != 1 or len(tracks) != 1):
              raise ValueError('resume requires exactly one target and one track')
          builds = []
          for result in resolve_tracks('abacus', tracks):
              if result['status'] == 'skipped':
                  print(json.dumps(result))
                  continue
              builds.extend(dict(result, target=t) for t in requested)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('builds=' + json.dumps(builds) + '\n')
          print(builds)
          PY
  build:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.resolve-source.outputs.builds != '[]'
    needs: [validate, resolve-source]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.builds) }}
    uses: ./.github/workflows/software-pair.yml
    with:
      software: abacus
      build: ${{ toJSON(matrix.build) }}
      retry_releases: ${{ inputs.retry_releases }}
      resume_run: ${{ inputs.resume_run }}
    secrets: inherit

  result:
    if: always()
    needs: [validate, resolve-source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every selected build completed
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD_ENABLED: 'true'
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Task | Result |\n|---|---|\n')
              for name, job in results.items():
                  out.write(f"| {name} | {job['result']} |\n")
          if results['validate']['result'] != 'success':
              raise SystemExit('Local validation did not succeed')
          if os.environ['GITHUB_EVENT_NAME'] in ('workflow_dispatch', 'schedule'):
              if results['resolve-source']['result'] != 'success':
                  raise SystemExit('Source resolution did not succeed')
              builds = json.loads(results['resolve-source']['outputs']['builds'])
              if builds and os.environ['BUILD_ENABLED'] == 'true':
                  if results['build']['result'] != 'success':
                      raise SystemExit('Selected builds did not complete')
              elif results['build']['result'] not in ('success', 'skipped'):
                  raise SystemExit('Build stage did not succeed')
          PY
