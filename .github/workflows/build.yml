name: Build HPC software
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      tracks:
        description: Comma-separated release tracks (development,prerelease,release)
        required: true
        default: development
      targets:
        description: Comma-separated accepted targets (dsprhbm,4v100-avx512,16v100-avx2,8v100v0-avx512)
        required: true
        default: dsprhbm
      resume_run:
        description: Optional terminated run id to repack without recompiling (one target only)
        required: false
  push:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native delivery test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools tcl
          command -v mksquashfs unsquashfs tclsh
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in controller/*.sh controller/*.sbatch; do
            bash -n "$script"
          done
  resolve-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRACKS: ${{ inputs.tracks }}
          TARGETS: ${{ inputs.targets }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from release_contract import SOFTWARE, TRACKS, resolve_tracks
          scheduled = os.environ['GITHUB_EVENT_NAME'] == 'schedule'
          allowed = SOFTWARE['abacus']['targets']
          requested = list(allowed) if scheduled else list(dict.fromkeys(t.strip() for t in os.environ['TARGETS'].split(',')))
          if not requested or any(t not in allowed for t in requested):
              raise ValueError('invalid target list')
          tracks = TRACKS if scheduled else [t.strip() for t in os.environ['RELEASE_TRACKS'].split(',')]
          if os.environ.get('RESUME_RUN') and (len(requested) != 1 or len(tracks) != 1):
              raise ValueError('resume requires exactly one target and one track')
          builds = []
          for result in resolve_tracks('abacus', tracks):
              if result['status'] == 'skipped':
                  if not scheduled:
                      raise ValueError(result['reason'])
                  print(json.dumps(result))
                  continue
              builds.extend(dict(result, target=t) for t in requested)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('builds=' + json.dumps(builds) + '\n')
          print(builds)
          PY
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [validate, resolve-source]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: hpc
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare repository-secret SSH key
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
      - name: Cache, submit, monitor and verify single SIF
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE_REF: ${{ matrix.build.source_ref }}
          RELEASE_TRACK: ${{ matrix.build.track }}
          SOURCE_SHA: ${{ matrix.build.source_sha }}
          SOFTWARE_VERSION: ${{ matrix.build.source_version }}
          TARGET: ${{ matrix.build.target }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: python3 -u controller/ci.py
      - name: Publish build logs and SAI artifact location
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.build.track }}-${{ matrix.build.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
      - name: Remove temporary SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ssh/key"
