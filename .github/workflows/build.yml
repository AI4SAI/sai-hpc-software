name: Build HPC software
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch/tag/SHA, latest-release or latest-prerelease
        required: true
        default: develop
      targets:
        description: Comma-separated targets (cpu-misc,v100,a100)
        required: true
        default: cpu-misc
  push:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n controller/container_entry.sh controller/abacus_build.sh controller/environment.sh controller/create_rootfs.sh
  resolve-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from resolve_source import resolve
          from remote_controller import TARGETS
          requested = list(dict.fromkeys(os.environ['TARGETS'].split(',')))
          if not requested or any(t not in TARGETS for t in requested):
              raise ValueError('invalid target list')
          result = resolve('deepmodeling/abacus-develop', os.environ['SOURCE_REF'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"sha={result['sha']}\nversion={result['version']}\n")
              out.write('targets=' + json.dumps(requested) + '\n')
          print(result)
          PY
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, resolve-source]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: hpc
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-source.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare repository-secret SSH key
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
      - name: Cache, submit, monitor and verify single SIF
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          SOFTWARE_VERSION: ${{ needs.resolve-source.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: python3 -u controller/ci.py
      - name: Publish build logs and SAI artifact location
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
      - name: Remove temporary SSH key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ssh/key"
