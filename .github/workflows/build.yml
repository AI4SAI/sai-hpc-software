name: Build HPC software
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: External source repository (owner/name)
        required: true
        default: deepmodeling/abacus-develop
      source_ref:
        description: Branch, tag, release tag, or commit
        required: true
        default: develop
  push:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**']
jobs:
  independent-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: resolve-source
    runs-on: ubuntu-latest
    environment: hpc
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 1
          path: source
      - name: Prepare SSH and bundle
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; mkdir -m 700 "$RUNNER_TEMP/ssh"; printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"; chmod 600 "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '[c0.sai.ai-4s.com]:12022 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBurYQExmMdgat4VU1Twmu2pqxsBjLP6eff9oc6/8N3KUCtoe8HU9eONghETLECdA7A+O9DpefDRba0AcSXTfQc=' > "$RUNNER_TEMP/ssh/known_hosts"
          git -C source fetch --unshallow 2>/dev/null || true
          echo "SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C source bundle create "$RUNNER_TEMP/source.bundle" --all
      - name: Upload, submit and monitor
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail; o="-i $RUNNER_TEMP/ssh/key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -p 12022"; so="-i $RUNNER_TEMP/ssh/key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -P 12022"; runid="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "mkdir -p ~/sai-hpc-software/runs/$runid/input ~/sai-hpc-software/controller ~/sai-hpc-software/containers/base"
          scp $so "$RUNNER_TEMP/source.bundle" "$REMOTE_USER@c0.sai.ai-4s.com:~/sai-hpc-software/runs/$runid/input/source.bundle"
          scp $so control/controller/software_controller.py "$REMOTE_USER@c0.sai.ai-4s.com:~/sai-hpc-software/controller/software_controller.py"
          scp $so control/controller/create_rootfs.sh "$REMOTE_USER@c0.sai.ai-4s.com:~/sai-hpc-software/controller/create_rootfs.sh"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "bash ~/sai-hpc-software/controller/create_rootfs.sh ~/sai-hpc-software/containers/base/minimal-v1"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "python3 ~/sai-hpc-software/controller/software_controller.py init abacus $runid"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "python3 ~/sai-hpc-software/controller/software_controller.py receive abacus $runid $SHA"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "python3 ~/sai-hpc-software/controller/software_controller.py submit abacus $runid ~/sai-hpc-software/containers/base/minimal-v1 CPU-MISC 0 60 '[\"sh\",\"-c\",\"cmake -S /workspace/source -B /tmp/abacus-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/software/abacus/dev/cpu-misc -DBUILD_TESTING=OFF -DUSE_CUDA=OFF && cmake --build /tmp/abacus-build --parallel 8 && cmake --install /tmp/abacus-build\"]' rush-cpu"
          ssh $o "$REMOTE_USER@c0.sai.ai-4s.com" "python3 ~/sai-hpc-software/controller/software_controller.py monitor $runid"
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 controller/validate_plan.py plans/cp2k.example.json --output /tmp/plan.json
      - run: python3 -m unittest discover -s tests
  resolve-source:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          REPOSITORY: ${{ inputs.source_repository }}
          REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          sha=$(git ls-remote "https://github.com/$REPOSITORY.git" "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}" | awk 'NF {print $1; exit}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve ref: $REF" >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
