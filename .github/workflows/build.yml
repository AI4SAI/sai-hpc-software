name: Build HPC software
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: External source repository (owner/name)
        required: true
        default: cp2k/cp2k
      source_ref:
        description: Branch, tag, release tag, or commit
        required: true
        default: master
  push:
    paths: ['plans/**', 'software/**', 'profiles/**', 'controller/**']
jobs:
  independent-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: resolve-source
    runs-on: ubuntu-latest
    environment: hpc
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 1
          path: source
      - name: Prepare SSH and bundle
        env:
          KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail; mkdir -m 700 "$RUNNER_TEMP/ssh"; printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/key"; chmod 600 "$RUNNER_TEMP/ssh/key"
          printf '%s\n' '[c0.sai.ai-4s.com]:12022 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBurYQExmMdgat4VU1Twmu2pqxsBjLP6eff9oc6/8N3KUCtoe8HU9eONghETLECdA7A+O9DpefDRba0AcSXTfQc=' > "$RUNNER_TEMP/ssh/known_hosts"
          git -C source bundle create "$RUNNER_TEMP/source.bundle" --all
      - name: Upload, submit and monitor
        env:
          USER: ${{ secrets.REMOTE_USER }}
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail; o="-i $RUNNER_TEMP/ssh/key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -p 12022"; runid="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh $o "$USER@c0.sai.ai-4s.com" "mkdir -p ~/sai-hpc-software/runs/$runid/input ~/sai-hpc-software/controller"
          scp $o "$RUNNER_TEMP/source.bundle" "$USER@c0.sai.ai-4s.com:~/sai-hpc-software/runs/$runid/input/source.bundle"
          scp $o controller/software_controller.py "$USER@c0.sai.ai-4s.com:~/sai-hpc-software/controller/software_controller.py"
          ssh $o "$USER@c0.sai.ai-4s.com" "python3 ~/sai-hpc-software/controller/software_controller.py receive cp2k $runid $SHA"
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 controller/validate_plan.py plans/cp2k.example.json --output /tmp/plan.json
      - run: python3 -m unittest discover -s tests
  build:
    needs: [validate, resolve-source]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: AI4SAI/sai-hpc-ci/.github/workflows/hpc-test.yml@f22c1b9e070e4c39e9033b1953636d5f7c8d2fea
    with:
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ needs.resolve-source.outputs.sha }}
      cluster_profile: sai-cuda12-openmpi5
      remote_root: ~/sai-hpc-software
      ssh_port: '12022'
      ssh_known_hosts: >-
        [c0.sai.ai-4s.com]:12022 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBurYQExmMdgat4VU1Twmu2pqxsBjLP6eff9oc6/8N3KUCtoe8HU9eONghETLECdA7A+O9DpefDRba0AcSXTfQc=
      secret_environment: hpc
      tests_json: >-
        {"version":1,"cluster_profile":"sai-cuda12-openmpi5","source":{"repository":"${{ inputs.source_repository }}","sha":"${{ needs.resolve-source.outputs.sha }}"},"tests":[{"name":"cp2k-16v100","nodes":1,"gpus_per_node":1,"ranks_per_node":1,"timeout_minutes":300,"working_directory":".","command":["bash","-lc","mkdir -p /workspace/build /workspace/results/install && cmake -S /workspace/source -B /workspace/build -DCP2K_USE_CUDA=ON -DCMAKE_INSTALL_PREFIX=/workspace/results/install && cmake --build /workspace/build -j2 && cmake --install /workspace/build"]}]}
    secrets:
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
  resolve-source:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          REPOSITORY: ${{ inputs.source_repository }}
          REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          sha=$(git ls-remote "https://github.com/$REPOSITORY.git" "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}" | awk 'NF {print $1; exit}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve ref: $REF" >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
