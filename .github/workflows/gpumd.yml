name: Track and build GPUMD

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      tracks:
        type: string
        required: false
        default: development,prerelease,release
      targets:
        type: string
        required: false
        default: 16v100-avx2
      retry_releases:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional branch/tag/full SHA override for one selected track
        required: false
      tracks:
        description: Release channels (development,prerelease,release)
        required: true
        default: development,prerelease,release
      targets:
        description: Native GPU targets (4v100-avx512,16v100-avx2,8v100v0-avx512)
        required: true
        default: 16v100-avx2
      retry_releases:
        description: Explicitly retry previously attempted release or prerelease versions
        type: boolean
        default: false
  push:
    paths: ['controller/gpumd_*', 'controller/ci.py', 'controller/software_controller.py', 'controller/remote_controller.py', 'controller/release_contract.py', 'controller/resolve_source.py', 'controller/delivery_layout.py', 'controller/export_native.py', 'controller/native_module.py', 'tests/test_gpumd.py', '.github/workflows/gpumd.yml', '.github/workflows/software-pair.yml']
  pull_request:
    paths: ['controller/gpumd_*', 'controller/ci.py', 'controller/software_controller.py', 'controller/remote_controller.py', 'controller/release_contract.py', 'controller/resolve_source.py', 'controller/delivery_layout.py', 'controller/export_native.py', 'controller/native_module.py', 'tests/test_gpumd.py', '.github/workflows/gpumd.yml', '.github/workflows/software-pair.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools tcl python3-yaml chrpath
          command -v mksquashfs unsquashfs tclsh
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in controller/*.sh controller/*.sbatch; do
            bash -n "$script"
          done

  resolve-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRACKS: ${{ inputs.tracks }}
          TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'controller')
          from resolve_source import resolve
          from release_contract import GPU_TARGETS, TRACKS, resolve_tracks
          scheduled = os.environ['GITHUB_EVENT_NAME'] == 'schedule'
          requested = list(dict.fromkeys(value.strip() for value in os.environ['TARGETS'].split(',')))
          if not requested or any(target not in GPU_TARGETS for target in requested):
              raise ValueError('GPUMD supports only its three native V100 GPU targets')
          tracks = [value.strip() for value in os.environ['TRACKS'].split(',')]
          override = os.environ.get('SOURCE_REF', '')
          if override and len(tracks) != 1:
              raise ValueError('a source override requires exactly one explicit track')
          resolver = (lambda repository, ref: resolve(repository, override)) if override else resolve
          rows = resolve_tracks('gpumd', tracks, resolver=resolver)
          builds = []
          for row in rows:
              if row['status'] == 'resolved':
                  builds.extend(dict(row, target=target) for target in requested)
              else:
                  print(f"skipped {row['track']}: {row['reason']}")
                  continue
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('builds=' + json.dumps(builds) + '\n')
          print(json.dumps(rows, indent=2))
          PY

  build:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.resolve-source.outputs.builds != '[]'
    needs: [validate, resolve-source]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.resolve-source.outputs.builds) }}
    uses: ./.github/workflows/software-pair.yml
    with:
      software: gpumd
      build: ${{ toJSON(matrix.build) }}
      retry_releases: ${{ inputs.retry_releases }}
    secrets: inherit

  result:
    if: always()
    needs: [validate, resolve-source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every selected build completed
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD_ENABLED: 'true'
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Task | Result |\n|---|---|\n')
              for name, job in results.items():
                  out.write(f"| {name} | {job['result']} |\n")
          if results['validate']['result'] != 'success':
              raise SystemExit('Local validation did not succeed')
          if os.environ['GITHUB_EVENT_NAME'] in ('workflow_dispatch', 'schedule'):
              if results['resolve-source']['result'] != 'success':
                  raise SystemExit('Source resolution did not succeed')
              builds = json.loads(results['resolve-source']['outputs']['builds'])
              if builds and os.environ['BUILD_ENABLED'] == 'true':
                  if results['build']['result'] != 'success':
                      raise SystemExit('Selected builds did not complete')
              elif results['build']['result'] not in ('success', 'skipped'):
                  raise SystemExit('Build stage did not succeed')
          PY
